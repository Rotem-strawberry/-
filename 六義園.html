<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title data-ja="六義園" data-en="Rikugien Garden">六義園</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:sans-serif; background-color:#a38675; }

/* ===== container ===== */
#container {
  width: 1000px;
  margin: 0 auto;
  background-color: #f5efe9;
  box-shadow: 0 0 15px rgba(0,0,0,0.15);
  border-radius: 10px;
  overflow: hidden;
}

/* ===== header ===== */
header {
  height: 200px;
  background-image: url("駒込ホーム.jpg");
  background-size: cover;
  background-position: center calc(50% - 60px);
}

.header {
  color: #ffffff;
  font-size: 52px;
  font-weight: bold;
  padding-top: 125px;
  margin-left: 20px;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
}

/* ===== nav ===== */
nav { background-color: #d6a68a; }
nav ul {
  list-style: none;
  display: flex;
  justify-content: space-between;
}
nav a {
  display: block;
  width: 160px;
  text-align: center;
  padding: 12px 0;
  text-decoration: none;
  color: #fff;
  font-weight: 500;
  border-radius: 6px;
}
nav a:hover { background-color: #cb5a2d; }

/* ===== content ===== */
.main { padding: 25px; }

h2 {
  margin-bottom: 15px;
  padding-top: 15px;
  color: #cb5a2d;
  font-weight: 600;
  text-align: center;
  font-size: 28px;
}

p {
  color: #130d0a;
  padding-top: 15px;
  font-size: 16px;
  line-height: 1.8;
  margin-bottom: 30px;
  text-align: center;
}

/* ===== slideshow ===== */
.slideshow-container {
  position: relative;
  width: 100%;
  max-width: 600px;
  height: 500px;
  margin: 0 auto 30px;
  overflow: hidden;
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.slideshow-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.slideshow-container img.active {
  display: block;
}

.slide-btn {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  cursor: pointer;
}

.slide-btn.left { left: 0; }
.slide-btn.right { right: 0; }

.slide-btn:hover {
  background: rgba(0,0,0,0.1);
}

/* ===== map ===== */
.map-frame {
  display:block;
  width:100%;
  max-width:600px;
  height:500px;
  margin:20px auto;
  border:none;
  border-radius:10px;
  background:#fff;
  box-shadow:0 4px 15px rgba(0,0,0,.3);
}

/* ===== language switch ===== */
.lang-switch {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #f5efe9;
  color: #cb5a2d;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  z-index: 9999;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}
.lang-switch:hover { background: #f1dbcd; }
</style>
</head>

<body>

<!-- Language Toggle -->
<div class="lang-switch" id="langToggle">JP / EN</div>

<div id="container">

<header>
  <div class="header" data-ja="駒込日和" data-en="Komagome Day Walk">
    駒込日和
  </div>
</header>

<nav>
  <ul>
    <li><a href="./index.html" data-ja="ホーム" data-en="Home">ホーム</a></li>
    <li><a href="./食べ飲みスポット.html" data-ja="食べ飲みスポット" data-en="Food & Drink">食べ飲みスポット</a></li>
    <li><a href="./観光地.html" data-ja="観光地" data-en="Sightseeing">観光地</a></li>
    <li><a href="./アクセス.html" data-ja="アクセス" data-en="Access">アクセス</a></li>
    <li><a href="./お問い合わせ.html" data-ja="お問い合わせ" data-en="Contact">お問い合わせ</a></li>
  </ul>
</nav>

<div class="main">

<h2 data-ja="六義園" data-en="Rikugien Garden">六義園</h2>

<p
data-ja="四季を通して美しい庭園ですが、特に寒い季節には独特の趣があります。紅葉や桜も楽しめ、静かに散策するのに最適な場所です。"
data-en="A beautiful garden throughout the year, especially atmospheric in colder seasons. Autumn leaves and cherry blossoms make it perfect for a calm walk.">
四季を通して美しい庭園ですが、特に寒い季節には独特の趣があります。<br>
紅葉や桜も楽しむことができ、とても落ち着いた雰囲気です。
</p>

<div class="slideshow-container">
  <img src="rikugiensub1.jpg" class="active">
  <img src="rikugiensub2.jpg">
  <img src="rikugiensub3.jpg">
  <img src="rikugiensub4.jpg">
  <img src="rikugienmain.jpg">
  <div class="slide-btn left"></div>
  <div class="slide-btn right"></div>
</div>

<p
data-ja="六義園を迷わず訪れられるよう、地図もご用意しました。"
data-en="A map is provided so you can reach Rikugien Garden easily.">
六義園を迷わず訪れられるよう、地図もご用意しました。
</p>

<iframe
class="map-frame"
src="https://www.google.com/maps?output=embed&z=15&ll=35.7331005,139.7431586&q=六義園">
</iframe>

</div>
</div>

<script>
/* ===== language switch ===== */
const langBtn = document.getElementById("langToggle");
let lang = localStorage.getItem("lang") || "ja";

function setLang(l) {
  document.documentElement.lang = l;
  document.querySelectorAll("[data-ja]").forEach(el => {
    el.textContent = el.dataset[l];
  });
  localStorage.setItem("lang", l);
}

langBtn.onclick = () => {
  lang = lang === "ja" ? "en" : "ja";
  setLang(lang);
};

setLang(lang);

/* ===== slideshow ===== */
let currentSlide = 0;
const slides = document.querySelectorAll(".slideshow-container img");
const leftBtn = document.querySelector(".slide-btn.left");
const rightBtn = document.querySelector(".slide-btn.right");

function changeSlide(dir) {
  slides[currentSlide].classList.remove("active");
  currentSlide = (currentSlide + dir + slides.length) % slides.length;
  slides[currentSlide].classList.add("active");
}

leftBtn.onclick = () => changeSlide(-1);
rightBtn.onclick = () => changeSlide(1);

setInterval(() => changeSlide(1), 5000);
</script>

</body>
</html>
