<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>お問い合わせ｜駒込日和</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  background-color:#a38675;
  color:#130d0a;
}

/* ===== Language Toggle ===== */
.lang-switch {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #f5efe9;
  color: #cb5a2d;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  z-index: 9999;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}
.lang-switch:hover {
  background: #f1dbcd;
}

/* ===== Layout ===== */
#container {
  width: 1000px;
  margin: 0 auto;
  background-color: #f5efe9;
  box-shadow: 0 0 15px rgba(0,0,0,0.15);
  border-radius: 10px;
  overflow: hidden;
}

/* Header */
header {
  height: 200px;
  background-image: url("駒込ホーム.jpg");
  background-size: cover;
  background-position: center calc(50% - 60px);
}

.header {
  color: #ffffff;
  font-size: 52px;
  font-weight: bold;
  padding-top: 125px;
  margin-left: 20px;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
}

nav { background-color:#d6a68a; }
nav ul { list-style:none; display:flex; justify-content:space-between; }
nav a {
  display:block;
  width:160px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  padding:12px 0;
  font-size:16px;
  transition:0.3s;
}
nav a:hover { background-color:#cb5a2d; }

.main { padding:50px; min-height:600px; text-align:center; }

h2 { font-size:28px; font-weight:600; color:#cb5a2d; margin-bottom:15px; }

.description {
  font-size:17px;
  color:#3a2a22;
  line-height:1.8;
  margin-bottom:40px;
}

.form-container {
  max-width:600px;
  margin:0 auto;
  padding:25px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 4px 15px rgba(0,0,0,0.15);
  text-align:left;
}

label { display:block; font-weight:500; margin-top:15px; }
input, textarea, select {
  width:100%;
  padding:10px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:16px;
}

button {
  margin-top:20px;
  width:100%;
  padding:12px;
  background:#d6a68a;
  color:#fff;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button:hover { background:#cb5a2d; }

#form-message {
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- Language Toggle -->
<div class="lang-switch" onclick="toggleLang()">JP / EN</div>

<div id="container">
  <header>
    <div class="header" data-ja="駒込日和" data-en="Komagome Day Walk">
      駒込日和
    </div>
  </header>
  

  <nav>
    <ul>
      <li><a href="index.html" data-ja="ホーム" data-en="Home">ホーム</a></li>
      <li><a href="食べ飲みスポット.html" data-ja="食べ飲みスポット" data-en="Food & Drink">食べ飲みスポット</a></li>
      <li><a href="観光地.html" data-ja="観光地" data-en="Spots">観光地</a></li>
      <li><a href="アクセス.html" data-ja="アクセス" data-en="Access">アクセス</a></li>
      <li><a href="お問い合わせ.html" data-ja="お問い合わせ" data-en="Contact">お問い合わせ</a></li>
    </ul>
  </nav>

  <div class="main">
    <h2 data-ja="お問い合わせ" data-en="Contact">
      お問い合わせ
    </h2>

    <p class="description"
       data-ja="散歩の途中で気づいたことや、ちょっとしたご質問など、お気軽にお寄せください。"
       data-en="If you notice something during your walk, or have a small question, feel free to reach out.">
      散歩の途中で気づいたことや、ちょっとしたご質問など、お気軽にお寄せください。
    </p>

    <div class="form-container">
      <form id="contact-form">

        <label data-ja="お名前 / Name" data-en="Name">
          お名前 / Name
        </label>
        <input type="text" name="user_name" required>

        <label data-ja="メールアドレス / Email" data-en="Email">
          メールアドレス / Email
        </label>
        <input type="email" name="user_email" required>

        <label data-ja="種類 / Type" data-en="Type">
          種類 / Type
        </label>
        <select name="type" required>
          <option value="" data-ja="選択してください" data-en="Please select">選択してください</option>
          <option value="question" data-ja="質問" data-en="Question">質問</option>
          <option value="suggestion" data-ja="提案" data-en="Suggestion">提案</option>
        </select>

        <label data-ja="内容 / Message" data-en="Message">
          内容 / Message
        </label>
        <textarea name="message" rows="5" required></textarea>

        <button type="submit" data-ja="送信" data-en="Send">
          送信
        </button>

      </form>
      <div id="form-message"></div>
    </div>
  </div>
</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
/* ===== Language Toggle ===== */
let currentLang = "ja";
function toggleLang() {
  currentLang = currentLang === "ja" ? "en" : "ja";
  document.querySelectorAll("[data-ja]").forEach(el => {
    el.textContent = el.dataset[currentLang];
  });
}

/* ===== EmailJS ===== */
window.onload = function() {
  const PUBLIC_KEY = "Hbi-fHKEHUhZLRd12";
  const SERVICE_ID = "service_icmyocl";
  const USER_TEMPLATE = "template_vr704ua";
  const COMPANY_TEMPLATE = "template_un5k6rd";

  emailjs.init(PUBLIC_KEY);

  const form = document.getElementById("contact-form");
  const formMessage = document.getElementById("form-message");

  form.addEventListener("submit", function(event){
    event.preventDefault();

    const confirmMessage =
      `Send with the following details?\n\n` +
      `Name: ${this.user_name.value}\n` +
      `Email: ${this.user_email.value}\n` +
      `Type: ${this.type.value}\n\n` +
      `${this.message.value}`;

    if (!confirm(confirmMessage)) {
      formMessage.textContent = "送信はキャンセルされました。";
      formMessage.style.color = "red";
      return;
    }

    emailjs.sendForm(SERVICE_ID, USER_TEMPLATE, this);
    emailjs.sendForm(SERVICE_ID, COMPANY_TEMPLATE, this)
      .then(() => {
        form.reset();
        formMessage.textContent =
          currentLang === "ja"
          ? "送信ありがとうございました。"
          : "Thank you for your message.";
        formMessage.style.color = "green";
        window.scrollTo({ top: 0, behavior: "smooth" });
      })
      .catch(() => {
        formMessage.textContent =
          currentLang === "ja"
          ? "送信に失敗しました。"
          : "Failed to send message.";
        formMessage.style.color = "red";
      });
  });
};
</script>

</body>
</html>
