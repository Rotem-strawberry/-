<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title data-ja="南北線 駒込駅" data-en="Namboku Line – Komagome Station">
  南北線 駒込駅
</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background-color: #a38675;
    color: #130d0a;
  }
  
  /* ===== Floating Language Button ===== */
  .lang-switch {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #f5efe9;
    color: #cb5a2d;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    z-index: 9999;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .lang-switch:hover {
    background: #f1dbcd;
  }

  #container {
    width: 1000px;
    margin: 0 auto;
    background-color: #f5efe9;
    box-shadow: 0 0 15px rgba(0,0,0,0.15);
    border-radius: 10px;
    overflow: hidden;
  }
  
  /* Header */
  header {
    height: 200px;
    background-image: url("駒込ホーム.jpg");
    background-size: cover;
    background-position: center calc(50% - 60px);
  }
  
  .header {
    color: #ffffff;
    font-size: 52px;
    font-weight: bold;
    padding-top: 125px;
    margin-left: 20px;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
  }

  nav { background-color: #d6a68a; }
  nav ul {
    list-style: none;
    display: flex;
    justify-content: space-between;
  }
  nav a {
    display: block;
    width: 160px;
    text-align: center;
    padding: 12px 0;
    text-decoration: none;
    color: #fff;
    font-weight: 500;
    transition: 0.3s;
    border-radius: 6px;
  }
  nav a:hover { background-color: #cb5a2d; }

  .main { padding: 25px; }

  h2 {
    margin-bottom:15px;
    padding-top:15px;
    color:#cb5a2d;
    font-weight:600;
    text-align:center;
    font-size:28px;
  }

  p {
    color:#130d0a;
    padding-top:15px;
    font-size:16px;
    line-height:1.8;
    margin-bottom:30px;
    text-align:center;
  }

  .photo {
    display:block;
    width:100%;
    max-width:600px;
    height:400px;
    margin:10px auto 30px auto;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    object-fit:cover;
  }

  .photo-tall { height:500px; }

  
</style>
</head>

<body>

<!-- language switch -->
<div class="lang-switch" id="langToggle">JP / EN</div>

<div id="container">
  <header>
    <div class="header" data-ja="駒込日和" data-en="Komagome Day Walk">
      駒込日和
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="./index.html" data-ja="ホーム" data-en="Home">ホーム</a></li>
      <li><a href="./食べ飲みスポット.html" data-ja="食べ飲みスポット" data-en="Food & Drink">食べ飲みスポット</a></li>
      <li><a href="./観光地.html" data-ja="観光地" data-en="Sightseeing">観光地</a></li>
      <li><a href="./アクセス.html" data-ja="アクセス" data-en="Access">アクセス</a></li>
      <li><a href="./お問い合わせ.html" data-ja="お問い合わせ" data-en="Contact">お問い合わせ</a></li>
    </ul>
  </nav>

  <div class="main">
    <h2
      data-ja="南北線 駒込駅"
      data-en="Namboku Line – Komagome Station">
      南北線 駒込駅
    </h2>

    <p
      data-ja="こちらは東京メトロ南北線の情報です。この路線は駒込駅に停まります。"
      data-en="This page provides information about the Tokyo Metro Namboku Line, which stops at Komagome Station.">
      こちらは東京メトロ南北線の情報です。この路線は駒込駅に停まります。
    </p>

    <img src="駒込緑線.jpg" alt="Komagome Station exterior" class="photo">

    <p
      data-ja="南北線の路線図で、全体のルートが分かります。"
      data-en="This route map shows the entire Namboku Line.">
      南北線の路線図で、全体のルートが分かります。
    </p>

    <img src="nambokuline.jpg" alt="Namboku Line Map" class="photo photo-tall">

    <p
      data-ja="駅構内マップで、改札や出口、ホームの位置がわかります。"
      data-en="The station map shows ticket gates, exits, and platform locations.">
      駅構内マップで、改札や出口、ホームの位置がわかります。
    </p>

    <img src="駅metro.jpg" alt="Komagome Station Map" class="photo">
  </div>
</div>

<script>
  const btn = document.getElementById("langToggle");
  let lang = localStorage.getItem("lang") || "ja";
  
  function setLang(l) {
    document.documentElement.lang = l;
    document.querySelectorAll("[data-ja]").forEach(el => {
      el.textContent = el.dataset[l];
    });
    localStorage.setItem("lang", l);
  }
  
  btn.onclick = () => {
    lang = (lang === "ja") ? "en" : "ja";
    setLang(lang);
  };
  
  setLang(lang);
  </script>
  
</body>
</html>
