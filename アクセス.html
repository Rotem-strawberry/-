<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title data-ja="アクセス｜駒込日和" data-en="Access | Komagome Stroll">アクセス｜駒込日和</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  background-color: #a38675;
  color: #130d0a;
}

.lang-switch {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #f5efe9;
  color: #cb5a2d;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  z-index: 9999;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}
.lang-switch:hover {
  background: #f1dbcd;
}

#container {
  width: 1000px;
  margin: 0 auto;
  background-color: #f5efe9;
  box-shadow: 0 0 15px rgba(0,0,0,0.15);
  border-radius: 10px;
  overflow: hidden;
}

/* Header */
header {
  height: 200px;
  background-image: url("駒込ホーム.jpg");
  background-size: cover;
  background-position: center calc(50% - 60px);
}

.header {
  color: #ffffff;
  font-size: 52px;
  font-weight: bold;
  padding-top: 125px;
  margin-left: 20px;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
}

/* Navigation */
nav {
  background-color: #d6a68a;
}

nav ul {
  list-style-type: none;
  display: flex;
  justify-content: space-between;
}

nav a {
  display: block;
  width: 160px;
  text-align: center;
  text-decoration: none;
  color: #fff;
  padding: 12px 0;
  font-size: 16px;
  transition: background-color 0.3s;
}

nav a:hover {
  background-color: #cb5a2d;
}

/* Main */
.main {
  padding: 50px;
  min-height: 600px;
  text-align: center;
}

h2 {
  font-size: 28px;
  font-weight: 600;
  color: #cb5a2d;
  margin-bottom: 15px;
}

.description {
  font-size: 17px;
  color: #3a2a22;
  line-height: 1.8;
  margin-bottom: 50px;
}

/* Image links */
.image-links {
  display: flex;
  justify-content: center;
  gap: 60px;
  flex-wrap: wrap;
}

.image-link {
  text-align: center;
  text-decoration: none;
  color: #130d0a;
}

.image-link img {
  width: 300px;
  height: 350px;
  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.image-link:hover img {
  transform: scale(1.05);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

.image-link h3 {
  margin-top: 10px;
  font-size: 20px;
  color: #cb5a2d;
}



</style>
</head>

<body>

<!-- language switch -->
<div class="lang-switch" id="langToggle">JP / EN</div>

<div id="container">
  <header>
    <div class="header" data-ja="駒込日和" data-en="Komagome Day Walk">
      駒込日和
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="index.html" data-ja="ホーム" data-en="Home">ホーム</a></li>
      <li><a href="食べ飲みスポット.html" data-ja="食べ飲みスポット" data-en="Food & Drink">食べ飲みスポット</a></li>
      <li><a href="観光地.html" data-ja="観光地" data-en="Sightseeing">観光地</a></li>
      <li><a href="アクセス.html" data-ja="アクセス" data-en="Access">アクセス</a></li>
      <li><a href="お問い合わせ.html" data-ja="お問い合わせ" data-en="Contact">お問い合わせ</a></li>
    </ul>
  </nav>

  <div class="main">
    <h2 data-ja="アクセス" data-en="Access">アクセス</h2>

    <p class="description"
      data-ja="駒込駅周辺へのアクセス方法をご案内します。JR山手線や東京メトロ南北線を利用すると便利です。"
      data-en="Here is how to access the area around Komagome Station. JR Yamanote Line and Tokyo Metro Namboku Line are convenient.">
      駒込駅周辺へのアクセス方法をご案内します。<br>
      JR山手線や東京メトロ南北線を利用すると便利です。
    </p>

    <div class="image-links">
      <a href="山手.html" class="image-link">
        <img src="駒込山手.jpg" alt="JR Yamanote Line">
        <h3 data-ja="JRの山手線" data-en="JR Yamanote Line">JRの山手線</h3>
      </a>

      <a href="南北.html" class="image-link">
        <img src="駒込緑線.jpg" alt="Tokyo Metro Namboku Line">
        <h3 data-ja="東京メトロの南北線" data-en="Tokyo Metro Namboku Line">東京メトロの南北線</h3>
      </a>
    </div>
  </div>
</div>

<script>
  const btn = document.getElementById("langToggle");
  let lang = localStorage.getItem("lang") || "ja";
  
  function setLang(l) {
    document.documentElement.lang = l;
    document.querySelectorAll("[data-ja]").forEach(el => {
      el.textContent = el.dataset[l];
    });
    localStorage.setItem("lang", l);
  }
  
  btn.onclick = () => {
    lang = (lang === "ja") ? "en" : "ja";
    setLang(lang);
  };
  
  setLang(lang);
  </script>
  
</body>
</html>
