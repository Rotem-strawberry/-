<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>観光地｜駒込日和</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  background-color: #a38675;
  color: #130d0a;
}

/* ===== Floating Language Button ===== */
.lang-switch {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #f5efe9;
  color: #cb5a2d;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  z-index: 9999;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}
.lang-switch:hover {
  background: #f1dbcd;
}

#container {
  width: 1000px;
  margin: 0 auto;
  background-color: #f5efe9;
  box-shadow: 0 0 15px rgba(0,0,0,0.15);
  border-radius: 10px;
  overflow: hidden;
}

/* Header */
header {
  height: 200px;
  background-image: url("駒込ホーム.jpg");
  background-size: cover;
  background-position: center calc(50% - 60px);
}

.header {
  color: #ffffff;
  font-size: 52px;
  font-weight: bold;
  padding-top: 125px;
  margin-left: 20px;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
}

/* Navigation */
nav {
  background-color: #d6a68a;
}

nav ul {
  list-style-type: none;
  display: flex;
  justify-content: space-between;
}

nav a {
  display: block;
  width: 160px;
  text-align: center;
  text-decoration: none;
  color: #fff;
  padding: 12px 0;
  font-size: 16px;
  transition: background-color 0.3s;
}

nav a:hover {
  background-color: #cb5a2d;
}

/* Main Section */
.main {
  padding: 50px;
  min-height: 600px;
  text-align: center;
}

h2 {
  font-size: 28px;
  font-weight: 600;
  color: #cb5a2d;
  margin-bottom: 15px;
}

.description {
  font-size: 17px;
  color: #3a2a22;
  line-height: 1.8;
  margin-bottom: 50px;
}

/* Image link section */
.image-links {
  display: flex;
  justify-content: center;
  gap: 60px;
  flex-wrap: wrap;
}

.image-link {
  text-align: center;
  text-decoration: none;
  color: #130d0a;
}

.image-link img {
  width: 300px;
  height: 350px;
  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.image-link:hover img {
  transform: scale(1.05);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

.image-link h3 {
  margin-top: 10px;
  font-size: 20px;
  color: #cb5a2d;
}

.image-link p {
  margin-top: 8px;
  font-size: 15px;
  line-height: 1.6;
  width: 300px;
  margin-left: auto;
  margin-right: auto;
}
</style>
</head>

<body>

<!-- Language Toggle -->
<div class="lang-switch" id="langToggle">JP / EN</div>

<div id="container">
  <header>
    <div class="header" data-ja="駒込日和" data-en="Komagome Day Walk">
      駒込日和
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="index.html" data-ja="ホーム" data-en="Home">ホーム</a></li>
      <li><a href="食べ飲みスポット.html" data-ja="食べ飲みスポット" data-en="Food & Drink">食べ飲みスポット</a></li>
      <li><a href="観光地.html" data-ja="観光地" data-en="Sightseeing">観光地</a></li>
      <li><a href="アクセス.html" data-ja="アクセス" data-en="Access">アクセス</a></li>
      <li><a href="お問い合わせ.html" data-ja="お問い合わせ" data-en="Contact">お問い合わせ</a></li>
    </ul>
  </nav>

  <div class="main">
    <h2 data-ja="観光地" data-en="Sightseeing">観光地</h2>

    <p class="description"
       data-ja="駒込には歴史や自然を感じられる観光スポットがたくさんあります。ぜひ散策して、駒込の魅力を体感してください。"
       data-en="Komagome is home to many sightseeing spots where you can experience history and nature. Take a walk and discover the charm of the area.">
      駒込には歴史や自然を感じられる観光スポットがたくさんあります。<br>
      ぜひ散策して、駒込の魅力を体感してください。
    </p>

    <div class="image-links">
      <a href="古河.html" class="image-link">
        <img src="furukawamain.jpg" alt="旧古河庭園">
        <h3 data-ja="旧古河庭園" data-en="Former Furukawa Garden">旧古河庭園</h3>
      </a>

      <a href="六義園.html" class="image-link">
        <img src="rikugienmain.jpg" alt="六義園">
        <h3 data-ja="六義園" data-en="Rikugien Garden">六義園</h3>
      </a>
    </div>
  </div>
</div>

<script>
  const btn = document.getElementById("langToggle");
  let lang = localStorage.getItem("lang") || "ja";
  
  function setLang(l) {
    document.documentElement.lang = l;
    document.querySelectorAll("[data-ja]").forEach(el => {
      el.textContent = el.dataset[l];
    });
    localStorage.setItem("lang", l);
  }
  
  btn.onclick = () => {
    lang = (lang === "ja") ? "en" : "ja";
    setLang(lang);
  };
  
  setLang(lang);
  </script>
  
</body>
</html>
